<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de proyectos</title>
<style>
:root{font:14px "Segoe UI",Arial,sans-serif;color:#18364b;background:#f1f4f6;--navy:#193749;--teal:#006e66}*{box-sizing:border-box}body{margin:0}header{background:var(--navy);color:white;padding:15px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{margin:0;font-size:22px}h2{font-size:17px;margin:0 0 12px}header small{color:#deedf0}.toolbar,nav,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar,nav{padding:10px 16px;background:white;border-bottom:1px solid #ccd8dd}button,select,input{font:inherit}button,select,input[type=date],input[type=number]{padding:6px 8px;border:1px solid #bacbd1;border-radius:4px;background:white;color:inherit}button{cursor:pointer}button:hover,button.on{background:#e1f2ed;color:#005950;border-color:#69a99d}button:disabled{opacity:.5}main{display:grid;grid-template-columns:215px minmax(0,1fr);gap:12px;padding:12px}aside,article{background:white;padding:14px;min-width:0;border:1px solid #d5e0e4}aside label{display:block;margin:12px 0 4px}aside select,aside input[type=date]{width:100%}aside label:has(input){margin:7px 0}#summary{padding:9px;background:#e4f2ef;margin-bottom:10px;font-weight:600}#graph{width:100%;height:325px}#legend{display:flex;gap:14px;flex-wrap:wrap}#legend span:before{content:'';display:inline-block;width:15px;height:3px;background:var(--c);vertical-align:middle;margin-right:4px}.scroll{overflow:auto;max-height:52vh}.daily{max-height:210px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid #e0e8ea;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#294758;color:white}tr.selected,tbody tr:hover{background:#e0f0ed}fieldset{border:0;margin:0;padding:0}svg text{font:12px "Segoe UI",sans-serif;fill:#425963}.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile{padding:12px;background:#f2f6f6}.tile button{display:block;width:100%;margin:5px 0;text-align:left}.bar{position:relative;min-width:220px;height:16px;background:#f1f4f5}.bar i,.bar b,.bar em{position:absolute;display:block}.bar i{height:9px;background:#98bbd1;top:2px}.bar b{height:100%;background:#00756d}.bar em{height:2px;background:#a57a26;bottom:0}pre{white-space:pre-wrap;font:inherit}#msg{padding:8px 16px;color:#295463}#tip{min-height:24px;color:#005950}.hint{color:#506978;font-size:13px}dialog{border:1px solid #a6babd;padding:22px}footer{padding:0 16px 15px} @media(max-width:850px){main{grid-template-columns:1fr}.cols{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:8px}header{align-items:flex-start;flex-direction:column}}
@media print{aside,.toolbar,nav,footer,#msg{display:none}main{display:block}.scroll{max-height:none}header{background:white;color:#18364b}}
</style>
<header><h1 id="title">Control de proyectos</h1><small>Creado por: Wc=.Campos www.JFSasesorias.org</small></header>
<div class="toolbar"><button id="open">Abrir cronograma…</button><input type="file" id="file" accept=".xml,.mpp,.xer" hidden><button id="ref">Cargar base externa…</button><input type="file" id="rf" accept=".xml,.mpp,.xer" hidden><button id="csv">Exportar CSV</button><button id="report">Informe técnico</button><button id="print">Imprimir vista</button><button id="close">Cerrar proyecto</button><button id="exit">Salir</button></div>
<div id="msg" role="status"></div><main><aside id="controls"></aside><article><nav id="tabs"></nav><p id="summary"></p><div id="content"></div></article></main><footer id="status"></footer><dialog id="dialog"><h2>Asignar línea base</h2><p><select id="refproject"></select></p><p><input id="refname" placeholder="Nombre de referencia"></p><button id="apply">Aplicar</button> <button id="cancel">Cancelar</button></dialog>
<script src="./vendor/cfb.js"></script><script type="module" src="./interfaz.js"></script></html>
